[project]
name = "portfolio-agent"
version = "0.1.0"
description = "Portfolio Agent for name.ai — APVA Phase 1 valuation graph + Tier 2 manager graph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.2.0",
    "langchain-aws>=0.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "jellyfish>=1.2.1",
    "pyspellchecker>=0.9.0",
    "vadersentiment>=3.3.2",
    "metaphone>=0.6",
    "langchain-mistralai>=1.1.6",
    "psycopg[binary]>=3.3.6",
    "selectolax>=0.4.12",
    "crawlee>=1.10.1",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["portfolio_agent"]
